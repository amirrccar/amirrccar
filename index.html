<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Buy & Hold vs. Market Timing calculator for Israeli investors in US markets — after capital gains tax, commissions and FX spreads.">
<title>מנוע תזמון שוק | Market Timing Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --bg: #f3f5fa;
  --bg-grad: radial-gradient(1200px 600px at 85% -10%, rgba(37, 99, 235, .10), transparent 60%),
             radial-gradient(900px 500px at 0% 0%, rgba(124, 58, 237, .08), transparent 60%);
  --surface: #ffffff;
  --surface-2: #f1f4fa;
  --surface-3: #e8edf6;
  --border: #e1e6ef;
  --border-strong: #cdd5e3;
  --text: #0f172a;
  --text-2: #334155;
  --muted: #64748b;
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, .10);
  --on-accent: #ffffff;
  --pos: #047857;
  --pos-strong: #059669;
  --pos-bg: #e6f7ef;
  --pos-border: #a7e3c8;
  --neg: #b91c1c;
  --neg-strong: #dc2626;
  --neg-bg: #fdecec;
  --neg-border: #f5b5b5;
  --warn: #b45309;
  --warn-bg: #fff6e5;
  --series-hold: #3b82f6;
  --series-timing: #f59e0b;
  --track: #dde3ee;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .06);
  --shadow-lg: 0 12px 40px rgba(15, 23, 42, .12);
  --radius: 16px;
  --radius-sm: 10px;
  --font: "Heebo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f1d;
    --bg-grad: radial-gradient(1200px 600px at 85% -10%, rgba(59, 130, 246, .14), transparent 60%),
               radial-gradient(900px 500px at 0% 0%, rgba(139, 92, 246, .12), transparent 60%);
    --surface: #111a2e;
    --surface-2: #17213a;
    --surface-3: #1e2a47;
    --border: #233050;
    --border-strong: #31406a;
    --text: #e8edf7;
    --text-2: #c3cce0;
    --muted: #8e9ab5;
    --accent: #60a5fa;
    --accent-strong: #93c5fd;
    --accent-soft: rgba(96, 165, 250, .14);
    --on-accent: #0a0f1d;
    --pos: #34d399;
    --pos-strong: #10b981;
    --pos-bg: rgba(16, 185, 129, .12);
    --pos-border: rgba(52, 211, 153, .35);
    --neg: #f87171;
    --neg-strong: #ef4444;
    --neg-bg: rgba(239, 68, 68, .12);
    --neg-border: rgba(248, 113, 113, .35);
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, .10);
    --series-hold: #60a5fa;
    --series-timing: #fbbf24;
    --track: #26324f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
  }
}

:root[data-theme="dark"] {
  --bg: #0a0f1d;
  --bg-grad: radial-gradient(1200px 600px at 85% -10%, rgba(59, 130, 246, .14), transparent 60%),
             radial-gradient(900px 500px at 0% 0%, rgba(139, 92, 246, .12), transparent 60%);
  --surface: #111a2e;
  --surface-2: #17213a;
  --surface-3: #1e2a47;
  --border: #233050;
  --border-strong: #31406a;
  --text: #e8edf7;
  --text-2: #c3cce0;
  --muted: #8e9ab5;
  --accent: #60a5fa;
  --accent-strong: #93c5fd;
  --accent-soft: rgba(96, 165, 250, .14);
  --on-accent: #0a0f1d;
  --pos: #34d399;
  --pos-strong: #10b981;
  --pos-bg: rgba(16, 185, 129, .12);
  --pos-border: rgba(52, 211, 153, .35);
  --neg: #f87171;
  --neg-strong: #ef4444;
  --neg-bg: rgba(239, 68, 68, .12);
  --neg-border: rgba(248, 113, 113, .35);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, .10);
  --series-hold: #60a5fa;
  --series-timing: #fbbf24;
  --track: #26324f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
}

/* =========================================================
   BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  transition: background-color .3s var(--ease), color .3s var(--ease);
  min-height: 100vh;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.hidden { display: none !important; }

/* =========================================================
   HEADER
   ========================================================= */
.header {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1320px; margin: 0 auto; padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: #fff; box-shadow: 0 6px 18px rgba(37, 99, 235, .35);
}
.brand-text { min-width: 0; }
.brand-title { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { margin: 0; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
}
.seg button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 999px;
  font-size: .85rem; font-weight: 600; color: var(--muted);
  transition: background-color .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(15, 23, 42, .15); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--text); }
.seg.lang button { min-width: 48px; font-weight: 700; }
.seg.block { display: flex; width: 100%; border-radius: var(--radius-sm); }
.seg.block button { flex: 1; border-radius: 8px; padding: 8px 10px; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
  transition: background-color .2s var(--ease), transform .2s var(--ease);
}
.icon-btn:hover { background: var(--surface-3); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }
[data-theme="dark"] .icon-sun { display: block; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="light"] .icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: block; }

/* =========================================================
   LAYOUT
   ========================================================= */
.container { max-width: 1320px; margin: 0 auto; padding: 24px; }
.layout { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 24px; align-items: start; }
.layout > * { min-width: 0; }
.inputs-col { display: grid; gap: 16px; }
.results-col { display: grid; gap: 16px; position: sticky; top: 84px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px;
  transition: background-color .3s var(--ease), border-color .3s var(--ease);
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title { margin: 0; font-size: .95rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-title .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); flex: 0 0 auto; }
.card-sub { margin: -8px 0 14px; color: var(--muted); font-size: .82rem; }

/* =========================================================
   FIELDS
   ========================================================= */
.field { padding: 10px 0; border-top: 1px dashed var(--border); }
.field:first-of-type { border-top: 0; padding-top: 0; }
.field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; margin-bottom: 8px; flex-wrap: wrap; }
.field-label { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .88rem; color: var(--text-2); }
.field-hint { font-size: .76rem; color: var(--muted); margin-top: 6px; }
.field-error { font-size: .76rem; color: var(--neg); margin-top: 6px; }

.num-wrap {
  display: inline-flex; align-items: center; direction: ltr;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 0 10px; min-width: 128px; height: 36px;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.num-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.num-wrap.invalid { border-color: var(--neg-strong); box-shadow: 0 0 0 3px var(--neg-bg); }
.num-wrap input {
  width: 100%; min-width: 0; border: 0; outline: 0; background: transparent;
  font-weight: 700; font-size: .95rem; text-align: right; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield; appearance: textfield;
}
.num-wrap input::-webkit-outer-spin-button,
.num-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num-wrap .unit { color: var(--muted); font-size: .82rem; font-weight: 600; padding-inline-start: 6px; white-space: nowrap; }
.num-wrap .prefix { color: var(--muted); font-size: .9rem; font-weight: 700; padding-inline-end: 4px; }

input[type="range"] {
  --pct: 50%;
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px; border-radius: 99px; margin: 6px 0 2px;
  background: linear-gradient(to right, var(--accent) 0, var(--accent) var(--pct), var(--track) var(--pct), var(--track) 100%);
  outline: none; cursor: pointer;
}
[dir="rtl"] input[type="range"] {
  background: linear-gradient(to left, var(--accent) 0, var(--accent) var(--pct), var(--track) var(--pct), var(--track) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--accent);
  box-shadow: 0 2px 6px rgba(15, 23, 42, .25);
  transition: transform .15s var(--ease);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--accent);
  box-shadow: 0 2px 6px rgba(15, 23, 42, .25);
}
input[type="range"]::-moz-range-track { background: transparent; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
.range-scale { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); }

.curr-select {
  height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
  padding: 0 10px; font-weight: 700; cursor: pointer;
}
.inline-row { display: flex; align-items: center; gap: 8px; margin-inline-start: auto; }

.switch-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--border); }
.switch { position: relative; flex: 0 0 auto; width: 44px; height: 24px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .slider {
  position: absolute; inset: 0; border-radius: 99px; background: var(--track);
  transition: background-color .2s var(--ease);
}
.switch .slider::after {
  content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s var(--ease);
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::after { transform: translateX(20px); }
[dir="rtl"] .switch input:checked + .slider::after { transform: translateX(-20px); }
.switch input:focus-visible + .slider { box-shadow: 0 0 0 3px var(--accent-soft); }

/* Info button + tooltip */
.info {
  width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-strong);
  background: var(--surface-2); color: var(--muted); font-size: .7rem; font-weight: 800;
  display: inline-grid; place-items: center; padding: 0; line-height: 1; flex: 0 0 auto;
  font-family: Georgia, serif; font-style: italic;
  transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.info:hover, .info[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tooltip {
  position: fixed; z-index: 200; max-width: min(320px, calc(100vw - 32px));
  background: var(--text); color: var(--surface); border-radius: 10px; padding: 10px 12px;
  font-size: .8rem; line-height: 1.5; box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateY(4px); pointer-events: none;
  transition: opacity .15s var(--ease), transform .15s var(--ease);
}
.tooltip.show { opacity: 1; transform: translateY(0); }
.tooltip strong { display: block; margin-bottom: 2px; font-size: .84rem; }

/* =========================================================
   RESULTS
   ========================================================= */
.basis-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.basis-bar .field-label { margin: 0; }
.basis-bar .seg { max-width: 100%; }
.basis-bar .seg button { white-space: normal; line-height: 1.25; }

.hero {
  position: relative; overflow: hidden;
  border-radius: var(--radius); padding: 22px 24px; border: 1px solid;
  display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
  transition: background-color .3s var(--ease), border-color .3s var(--ease);
}
.hero.win { background: var(--pos-bg); border-color: var(--pos-border); }
.hero.lose { background: var(--neg-bg); border-color: var(--neg-border); }
.hero.tie { background: var(--warn-bg); border-color: var(--border-strong); }
.hero-icon {
  width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; color: #fff;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .18);
}
.hero.win .hero-icon { background: linear-gradient(135deg, #10b981, #047857); }
.hero.lose .hero-icon { background: linear-gradient(135deg, #f87171, #b91c1c); }
.hero.tie .hero-icon { background: linear-gradient(135deg, #fbbf24, #b45309); }
.hero-icon svg { width: 30px; height: 30px; }
.hero-kicker { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.hero-title { margin: 0; font-size: clamp(1.3rem, 2.4vw, 1.8rem); font-weight: 800; letter-spacing: -.015em; line-height: 1.2; }
.hero.win .hero-title { color: var(--pos); }
.hero.lose .hero-title { color: var(--neg); }
.hero.tie .hero-title { color: var(--warn); }
.hero-sub { margin: 6px 0 0; color: var(--text-2); font-size: .92rem; }
.hero-sub b { font-weight: 800; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
  box-shadow: var(--shadow); min-width: 0;
}
.kpi.primary { background: linear-gradient(160deg, var(--accent-soft), transparent 70%), var(--surface); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.kpi-label { display: flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; color: var(--muted); }
.kpi-value { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; line-height: 1.15; }
.kpi.primary .kpi-value { color: var(--accent); font-size: 1.85rem; }
.kpi-sub { font-size: .72rem; color: var(--muted); margin-top: 4px; }
.kpi-value.pos { color: var(--pos); }
.kpi-value.neg { color: var(--neg); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }

table.cmp { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.cmp th, table.cmp td { padding: 11px 8px; text-align: start; border-bottom: 1px solid var(--border); }
table.cmp th { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
table.cmp td.n, table.cmp th.n { text-align: end; }
table.cmp tbody tr:last-child td { border-bottom: 0; }
table.cmp tr.diff td { background: var(--surface-2); font-weight: 800; }
table.cmp tr.diff td:first-child { border-start-start-radius: 10px; border-end-start-radius: 10px; }
table.cmp tr.diff td:last-child { border-start-end-radius: 10px; border-end-end-radius: 10px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 8px; vertical-align: middle; }
.badge-win {
  display: inline-block; margin-inline-start: 6px; font-size: .66rem; font-weight: 800; padding: 2px 7px; border-radius: 99px;
  background: var(--pos-bg); color: var(--pos); border: 1px solid var(--pos-border); vertical-align: middle;
}
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.strong { font-weight: 800; }

/* Bar chart */
.bars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: end; height: 230px; padding: 8px 8px 0; position: relative; }
.bars::before {
  content: ""; position: absolute; inset: 8px 0 0; pointer-events: none;
  background: repeating-linear-gradient(to top, var(--border) 0 1px, transparent 1px 25%);
  opacity: .8;
}
.bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; z-index: 1; }
.bar-val { font-weight: 800; font-size: .9rem; margin-bottom: 6px; white-space: nowrap; }
.bar {
  width: min(96px, 70%); border-radius: 10px 10px 4px 4px; min-height: 4px;
  height: 0; transition: height .55s var(--ease), background-color .3s var(--ease);
  position: relative;
}
.bar.hold { background: linear-gradient(to top, color-mix(in srgb, var(--series-hold) 70%, #000 0%), var(--series-hold)); }
.bar.timing { background: linear-gradient(to top, color-mix(in srgb, var(--series-timing) 70%, #000 0%), var(--series-timing)); }
.bar.winner { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--pos-strong); }
.bar-labels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 10px; text-align: center; border-top: 1px solid var(--border-strong); padding-top: 10px; }
.bar-label { font-weight: 700; font-size: .85rem; }
.bar-label small { display: block; color: var(--muted); font-weight: 500; font-size: .74rem; }
.chart-note { font-size: .74rem; color: var(--muted); margin-top: 10px; }

/* Breakdown list */
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.flow li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; font-size: .86rem; }
.flow li:nth-child(odd) { background: var(--surface-2); }
.flow li .k { color: var(--text-2); }
.flow li .v { font-weight: 700; white-space: nowrap; }
.flow li.total { background: var(--accent-soft); font-weight: 800; }
.flow li.total .k { color: var(--text); font-weight: 800; }

/* Sensitivity chart */
.sens { position: relative; height: 170px; margin-top: 24px; display: flex; align-items: stretch; gap: 3px; padding: 0 2px; }
.sens-col { flex: 1; display: grid; grid-template-rows: 1fr 1fr; min-width: 0; position: relative; border-radius: 4px; cursor: default; }
.sens-col:hover { background: var(--surface-2); }
.sens-up, .sens-down { display: flex; justify-content: center; }
.sens-up { align-items: flex-end; border-bottom: 1px solid var(--border-strong); }
.sens-down { align-items: flex-start; }
.sens-bar { width: 78%; transition: height .45s var(--ease); }
.sens-up .sens-bar { background: var(--pos-strong); border-radius: 4px 4px 0 0; }
.sens-down .sens-bar { background: var(--neg-strong); border-radius: 0 0 4px 4px; }
.sens-col.current { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -1px; }
.sens-trigger {
  position: absolute; top: -6px; bottom: -6px; width: 0; border-inline-start: 2px dashed var(--accent);
  pointer-events: none; transition: inset-inline-start .45s var(--ease);
}
.sens-trigger span {
  position: absolute; top: -18px; transform: translateX(-50%); font-size: .68rem; font-weight: 800; color: var(--accent);
  white-space: nowrap; background: var(--surface); padding: 0 4px; border-radius: 4px;
}
[dir="rtl"] .sens-trigger span { transform: translateX(50%); }
.sens-axis { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); margin-top: 8px; padding: 0 2px; }
.sens-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); margin-top: 10px; }
.sens-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }

/* Buttons */
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: .92rem;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  transition: background-color .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); flex: 1; }
.btn.primary:hover { background: var(--accent-strong); }
.btn svg { width: 18px; height: 18px; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); z-index: 300;
  background: var(--text); color: var(--surface); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: .9rem;
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease), transform .25s var(--ease);
  max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.warn-box {
  background: var(--warn-bg); color: var(--text-2); border: 1px solid var(--border); border-inline-start: 4px solid var(--warn);
  border-radius: 10px; padding: 10px 12px; font-size: .82rem;
}
.footer { max-width: 1320px; margin: 0 auto; padding: 8px 24px 40px; color: var(--muted); font-size: .78rem; }
.footer p { margin: 0 0 6px; }
.formula { font-family: var(--mono); font-size: .78rem; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .results-col { position: static; order: -1; }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  body { font-size: 14px; }
  .container { padding: 16px; }
  .header-inner { padding: 10px 16px; }
  .brand-sub { display: none; }
  .brand-title { font-size: 1rem; }
  .logo { width: 34px; height: 34px; border-radius: 10px; }
  .card { padding: 16px; }
  .hero { grid-template-columns: 1fr; padding: 18px; gap: 12px; }
  .hero-icon { width: 48px; height: 48px; border-radius: 14px; }
  .kpi-value { font-size: 1.3rem; }
  .kpi.primary .kpi-value { font-size: 1.5rem; }
  .bars { height: 190px; }
  table.cmp { font-size: .82rem; }
  table.cmp th, table.cmp td { padding: 9px 4px; }
  .footer { padding: 8px 16px 32px; }
  .seg button { padding: 6px 10px; }
  .basis-bar .seg { width: 100%; border-radius: var(--radius-sm); }
  .basis-bar .seg button { flex: 1; border-radius: 8px; }
}
@media (max-width: 380px) {
  .kpis { grid-template-columns: 1fr; }
  .num-wrap { min-width: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

<body>
<noscript><div style="padding:16px;text-align:center">This calculator requires JavaScript. / מחשבון זה דורש JavaScript.</div></noscript>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-title" data-i18n="appTitle"></h1>
        <p class="brand-sub" data-i18n="appSub"></p>
      </div>
    </div>
    <div class="header-actions">
      <div class="seg lang" role="group" data-i18n-aria="langLabel">
        <button type="button" data-action="lang" data-val="he" aria-pressed="true" lang="he">עב</button>
        <button type="button" data-action="lang" data-val="en" aria-pressed="false" lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" data-action="theme" data-i18n-aria="themeLabel" data-i18n-title="themeLabel">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="container" id="app">
  <div class="layout">
    <!-- ================= INPUTS ================= -->
    <section class="inputs-col" aria-labelledby="inputsHeading">
      <h2 id="inputsHeading" class="sr-only" data-i18n="inputsHeading"></h2>

      <div class="card" id="card-position">
        <div class="card-head">
          <h3 class="card-title"><span class="dot"></span><span data-i18n="cardPosition"></span></h3>
        </div>
        <div data-fields="position"></div>
      </div>

      <div class="card" id="card-costs">
        <div class="card-head">
          <h3 class="card-title"><span class="dot"></span><span data-i18n="cardCosts"></span></h3>
        </div>
        <div data-fields="costs"></div>
      </div>

      <div class="card" id="card-fx">
        <div class="card-head">
          <h3 class="card-title"><span class="dot"></span><span data-i18n="cardFx"></span></h3>
        </div>
        <div data-fields="fx"></div>
        <div class="switch-row">
          <div>
            <div class="field-label"><span data-i18n="f_park"></span><button type="button" class="info" data-tip="park">i</button></div>
            <div class="field-hint" data-i18n="f_parkHint"></div>
          </div>
          <label class="switch">
            <input type="checkbox" id="park" data-key="park">
            <span class="slider" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="f_park"></span>
          </label>
        </div>
      </div>

      <div class="card" id="card-exec">
        <div class="card-head">
          <h3 class="card-title"><span class="dot"></span><span data-i18n="cardExec"></span></h3>
        </div>
        <div class="field">
          <div class="field-head">
            <div class="field-label"><span data-i18n="f_dcaMode"></span><button type="button" class="info" data-tip="dca">i</button></div>
          </div>
          <div class="seg block" role="group" data-i18n-aria="f_dcaMode">
            <button type="button" data-action="set" data-key="dcaMode" data-val="lump" aria-pressed="true" data-i18n="dca_lump"></button>
            <button type="button" data-action="set" data-key="dcaMode" data-val="staged" aria-pressed="false" data-i18n="dca_staged"></button>
          </div>
        </div>
        <div data-fields="exec"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn" data-action="reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span data-i18n="reset"></span>
        </button>
      </div>
    </section>

    <!-- ================= RESULTS ================= -->
    <section class="results-col" aria-labelledby="resultsHeading" aria-live="polite">
      <h2 id="resultsHeading" class="sr-only" data-i18n="resultsHeading"></h2>

      <div class="card basis-bar">
        <div class="field-label"><span data-i18n="basis"></span><button type="button" class="info" data-tip="basis">i</button></div>
        <div class="seg" role="group" data-i18n-aria="basis">
          <button type="button" data-action="set" data-key="basis" data-val="mtm" aria-pressed="true" data-i18n="basis_mtm"></button>
          <button type="button" data-action="set" data-key="basis" data-val="liq" aria-pressed="false" data-i18n="basis_liq"></button>
        </div>
      </div>

      <div class="hero win" id="hero">
        <div class="hero-icon" id="heroIcon" aria-hidden="true"></div>
        <div>
          <p class="hero-kicker" data-i18n="heroKicker"></p>
          <h3 class="hero-title" id="heroTitle"></h3>
          <p class="hero-sub" id="heroSub"></p>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi primary">
          <div class="kpi-label"><span data-i18n="kpiTrigger"></span><button type="button" class="info" data-tip="trigger">i</button></div>
          <div class="kpi-value num" id="kpiTrigger">—</div>
          <div class="kpi-sub" data-i18n="kpiTriggerSub"></div>
        </div>
        <div class="kpi">
          <div class="kpi-label"><span data-i18n="kpiMargin"></span><button type="button" class="info" data-tip="margin">i</button></div>
          <div class="kpi-value num" id="kpiMargin">—</div>
          <div class="kpi-sub" data-i18n="kpiMarginSub"></div>
        </div>
        <div class="kpi">
          <div class="kpi-label"><span data-i18n="kpiClassic"></span><button type="button" class="info" data-tip="classic">i</button></div>
          <div class="kpi-value num" id="kpiClassic">—</div>
          <div class="kpi-sub"><span class="formula">(T·R + 2C) / (1 + R − C)</span></div>
        </div>
        <div class="kpi">
          <div class="kpi-label"><span data-i18n="kpiCost"></span><button type="button" class="info" data-tip="friction">i</button></div>
          <div class="kpi-value num" id="kpiCost">—</div>
          <div class="kpi-sub" data-i18n="kpiCostSub"></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3 class="card-title"><span class="dot"></span><span data-i18n="tableTitle"></span></h3></div>
          <table class="cmp">
            <thead>
              <tr>
                <th data-i18n="colStrategy"></th>
                <th class="n" data-i18n="colUsd"></th>
                <th class="n" data-i18n="colIls"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><span class="swatch" style="background:var(--series-hold)"></span><span data-i18n="rowHold"></span><span class="badge-win hidden" id="winHold" data-i18n="winner"></span></td>
                <td class="n num" id="holdUsd">—</td>
                <td class="n num" id="holdIls">—</td>
              </tr>
              <tr>
                <td><span class="swatch" style="background:var(--series-timing)"></span><span data-i18n="rowTiming"></span><span class="badge-win hidden" id="winTiming" data-i18n="winner"></span></td>
                <td class="n num" id="timingUsd">—</td>
                <td class="n num" id="timingIls">—</td>
              </tr>
              <tr class="diff">
                <td data-i18n="rowDiff"></td>
                <td class="n num" id="diffUsd">—</td>
                <td class="n num" id="diffIls">—</td>
              </tr>
            </tbody>
          </table>
          <p class="chart-note" id="ilsNote"></p>
        </div>

        <div class="card">
          <div class="card-head"><h3 class="card-title"><span class="dot"></span><span data-i18n="chartTitle"></span></h3></div>
          <div class="bars" role="img" id="barsWrap">
            <div class="bar-col"><div class="bar-val num" id="barHoldVal">—</div><div class="bar hold" id="barHold"></div></div>
            <div class="bar-col"><div class="bar-val num" id="barTimingVal">—</div><div class="bar timing" id="barTiming"></div></div>
          </div>
          <div class="bar-labels">
            <div class="bar-label"><span data-i18n="rowHold"></span><small id="barHoldPct"></small></div>
            <div class="bar-label"><span data-i18n="rowTiming"></span><small id="barTimingPct"></small></div>
          </div>
          <p class="chart-note" data-i18n="chartNote"></p>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3 class="card-title"><span class="dot"></span><span data-i18n="flowTitle"></span></h3></div>
          <ul class="flow" id="flow"></ul>
        </div>
        <div class="card">
          <div class="card-head"><h3 class="card-title"><span class="dot"></span><span data-i18n="sensTitle"></span></h3></div>
          <p class="card-sub" data-i18n="sensSub"></p>
          <div class="sens" id="sens"></div>
          <div class="sens-axis" id="sensAxis"></div>
          <div class="sens-legend">
            <span><i style="background:var(--pos-strong)"></i><span data-i18n="legendTiming"></span></span>
            <span><i style="background:var(--neg-strong)"></i><span data-i18n="legendHold"></span></span>
            <span><i style="background:transparent;border:2px dashed var(--accent)"></i><span data-i18n="legendTrigger"></span></span>
          </div>
        </div>
      </div>

      <div class="warn-box hidden" id="warnBox"></div>

      <div class="actions">
        <button type="button" class="btn primary" data-action="copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span data-i18n="copy"></span>
        </button>
      </div>
    </section>
  </div>
</main>

<footer class="footer">
  <p data-i18n="disclaimer"></p>
  <p data-i18n="assumptions"></p>
</footer>

<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  function money(n, cur, opts = {}) {

    const abs = Math.abs(n);

    tranches.forEach(tr => {
      if (tr.w <= 0) return;
      units += (cashDeploy * tr.w * (1 - Cb)) / tr.price;
      maxPrice = Math.max(maxPrice, tr.price);
    });
    const feeBuy = cashDeploy * Cb;
    const invested = cashDeploy * (1 - Cb);
    const avgPrice = units > 0 ? invested / units : troughPrice;

    const timingRec = units * 1.0;                        // value after recovery to peak
    const timingBasis = cashDeploy;                       // cost basis incl. buy commission
    const timingGain = Math.max(0, timingRec - timingBasis);
    const timingExitTax = timingGain * T;
    const timingExitFee = timingRec * Cs;
    const timingNetUsd = p.basis === 'liq' ? timingRec - timingExitTax - timingExitFee : timingRec;

    const friction = V0 > 0 ? (taxNow + feeSell + fxPark + feeBuy) / V0 : 0;

    return {
      V0, Vdrop, Vrec,
      hold: { netUsd: holdNetUsd, netIls: toIls(holdNetUsd), exitTax: holdExitTax, exitFee: holdExitFee },
      timing: {
        taxNow, feeSell, cashNet, fxPark, cashDeploy, feeBuy, avgPrice, troughPrice, maxPrice, units,
        rec: timingRec, exitTax: timingExitTax, exitFee: timingExitFee,
        netUsd: timingNetUsd, netIls: toIls(timingNetUsd)
      },
      diffUsd: timingNetUsd - holdNetUsd,
      diffIls: toIls(timingNetUsd) - toIls(holdNetUsd),
      friction
    };
  }

  /** Exact break-even drop via bisection (timing advantage is monotonic in D). */
  function solveTrigger(p) {
    const f = D => {
      const r = evaluate(p, D);
      const scale = Math.max(1, r.V0);
      return r.diffUsd / scale;
    };
    const lo0 = 0, hi0 = 0.99;
    const fLo = f(lo0);
    if (fLo >= 0) return { value: 0, reachable: true };
    const fHi = f(hi0);
    if (fHi < 0) return { value: NaN, reachable: false };
    let lo = lo0, hi = hi0;
    for (let i = 0; i < 80; i++) {
      const mid = (lo + hi) / 2;
      if (f(mid) >= 0) hi = mid; else lo = mid;
      if (hi - lo < 1e-10) break;
    }
    return { value: (lo + hi) / 2, reachable: true };
  }

  /** Spec closed-form approximation. */
  function classicTrigger(p) {
    const C = (p.Cs + p.Cb) / 2;
    const den = 1 + p.R - C;
    if (den <= 0) return NaN;
    return (p.T * p.R + 2 * C) / den;
  }

  function compute() {
    const p = normalisedParams(state.v);
    const res = evaluate(p, p.D);
    const trig = solveTrigger(p);
    const classic = classicTrigger(p);

    const sensMax = Math.min(95, Math.max(40, Math.ceil((Math.max(p.D, isNum(trig.value) ? trig.value : 0) * 1.5 * 100) / 5) * 5)) / 100;
    const N = 20;
    const sens = [];
    for (let i = 0; i <= N; i++) {
      const D = (sensMax * i) / N;
      sens.push({ D, diff: evaluate(p, D).diffIls });
    }
    return { p, res, trig, classic, sens, sensMax };
  }

  /* =========================================================
     DOM BUILDERS
     ========================================================= */
  function fieldUnit(f) {
    if (f.unit === 'cur') return '';
    return f.unit;
  }

  function buildFields() {
    $$('[data-fields]').forEach(container => {
      const group = container.dataset.fields;
      container.innerHTML = FIELDS.filter(f => f.group === group).map(f => {
        const unit = fieldUnit(f);
        const prefix = f.currency ? `<span class="prefix" id="pfx-${f.key}">$</span>` : '';
        const currencySel = f.currency
          ? `<select class="curr-select" data-key="currency" id="currency" aria-label="" data-i18n-aria="f_currency">
               <option value="USD">USD $</option>
               <option value="ILS">ILS ₪</option>
             </select>`
          : '';
        return `
          <div class="field${f.dcaOnly ? ' dca-only' : ''}" data-field="${f.key}">
            <div class="field-head">
              <label class="field-label" for="num-${f.key}">
                <span data-i18n="f_${f.key}"></span>
                <button type="button" class="info" data-tip="${f.tip}">i</button>
              </label>
              <div class="inline-row">
                ${currencySel}
                <div class="num-wrap" id="wrap-${f.key}">
                  ${prefix}
                  <input type="number" inputmode="decimal" id="num-${f.key}" data-key="${f.key}"
                         min="${f.min}" max="${f.max}" step="any" autocomplete="off">
                  ${unit ? `<span class="unit">${unit}</span>` : ''}
                </div>
              </div>
            </div>
            <input type="range" id="rng-${f.key}" data-key="${f.key}" min="${f.sMin}" max="${f.sMax}" step="${f.step}"
                   aria-labelledby="num-${f.key}">
            <div class="range-scale"><span class="num" id="smin-${f.key}"></span><span class="num" id="smax-${f.key}"></span></div>
            <div class="field-hint num-hint" id="hint-${f.key}"></div>
            <div class="field-error hidden" id="err-${f.key}"></div>
          </div>`;
      }).join('');
    });
  }

  function formatScale(f, val) {
    if (f.currency) {
      const sym = state.v.currency === 'ILS' ? '₪' : '$';
      if (val >= 1e6) return sym + plainNum(val / 1e6, 1) + 'M';
      if (val >= 1e3) return sym + plainNum(val / 1e3, 0) + 'K';
      return sym + plainNum(val, 0);
    }
    return plainNum(val, 2) + (f.unit === '%' ? '%' : '');
  }

  function syncSlider(key) {
    const f = FIELD_MAP[key];
    const rng = $('#rng-' + key);
    if (!rng) return;
    const val = state.v[key];
    const sv = clamp(val, f.sMin, f.sMax);
    rng.value = String(sv);
    const pctPos = f.sMax > f.sMin ? ((sv - f.sMin) / (f.sMax - f.sMin)) * 100 : 0;
    rng.style.setProperty('--pct', pctPos + '%');
  }

  function syncNumber(key) {
    const f = FIELD_MAP[key];
    const num = $('#num-' + key);
    if (!num) return;
    const dec = f.currency ? 2 : 4;
    num.value = String(Number(state.v[key].toFixed(dec)));
  }

  function syncAllInputs() {
    FIELDS.forEach(f => { syncNumber(f.key); syncSlider(f.key); setInvalid(f.key, false); });
    $('#currency').value = state.v.currency;
    $('#park').checked = state.v.park;
    $$('[data-action="set"]').forEach(b => b.setAttribute('aria-pressed', String(state.v[b.dataset.key] === b.dataset.val)));
    $$('.dca-only').forEach(el => el.classList.toggle('hidden', state.v.dcaMode !== 'staged'));
    updateCurrencyUi();
  }

  function updateCurrencyUi() {
    const pfx = $('#pfx-principal');
    if (pfx) pfx.textContent = state.v.currency === 'ILS' ? '₪' : '$';
    FIELDS.forEach(f => {
      const a = $('#smin-' + f.key), b = $('#smax-' + f.key);
      if (a) a.textContent = formatScale(f, f.sMin);
      if (b) b.textContent = formatScale(f, f.sMax) + (f.max > f.sMax ? '+' : '');
    });
  }

  function setInvalid(key, on) {
    const wrap = $('#wrap-' + key);
    const err = $('#err-' + key);
    if (!wrap || !err) return;
    wrap.classList.toggle('invalid', on);
    err.classList.toggle('hidden', !on);
    if (on) {
      const f = FIELD_MAP[key];
      err.textContent = t('err_range', { min: plainNum(f.min, 2), max: plainNum(f.max, 2) });
      state.invalid.add(key);
    } else {
      state.invalid.delete(key);
    }
    const num = $('#num-' + key);
    if (num) num.setAttribute('aria-invalid', String(on));
  }

  /* =========================================================
     RENDER
     ========================================================= */
  const ICONS = {
    win: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M14 17h7v-7"/></svg>',
    lose: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
    tie: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14"/></svg>'
  };

  function verdict(res) {
    const tol = Math.max(1, res.V0 * 0.0005); // 0.05% of position or $1
    if (Math.abs(res.diffUsd) <= tol) return 'tie';
    return res.diffUsd > 0 ? 'win' : 'lose';
  }

  function render() {
    const out = compute();
    state.last = out;
    const { p, res, trig, classic, sens, sensMax } = out;
    const v = verdict(res);
    const H = res.hold, Tm = res.timing;

    // Field hints
    const curInput = state.v.currency;
    const v0Input = curInput === 'ILS' ? res.V0 * p.FX : res.V0;
    $('#hint-principal').innerHTML = escapeHtml(t('hint_principal', { v0: '⁦' + money(v0Input, curInput) + '⁩' }));
    $('#hint-fomo').textContent = t('hint_fomo', { p: '⁦' + pct(Tm.troughPrice, 2) + '⁩' });
    $('#hint-dcaSplit').textContent = t('hint_dcaSplit', { rest: '⁦' + pct(1 - p.split, 0) + '⁩' });
    $('#hint-drop').textContent = '';
    ['gain', 'tax', 'commSell', 'commBuy', 'fxRate', 'fxFee', 'dcaBounce'].forEach(k => { const h = $('#hint-' + k); if (h) h.textContent = ''; });

    // Hero
    const hero = $('#hero');
    hero.className = 'hero ' + v;
    $('#heroIcon').innerHTML = ICONS[v];
    $('#heroTitle').textContent = v === 'win' ? t('heroWin') : v === 'lose' ? t('heroLose') : t('heroTie');
    const diffAbs = '<b class="num">' + escapeHtml(money(Math.abs(res.diffIls), 'ILS')) + '</b>';
    const dStr = '<span class="num">' + escapeHtml(pct(p.D, 2)) + '</span>';
    const tStr = '<span class="num">' + escapeHtml(trig.reachable ? pct(trig.value, 2) : t('unreachable')) + '</span>';
    let sub;
    if (v === 'win') sub = t('heroSubWin', { diff: diffAbs, d: dStr, t: tStr });
    else if (v === 'lose') sub = trig.reachable ? t('heroSubLose', { diff: diffAbs, d: dStr, t: tStr }) : t('heroSubLoseNever', { diff: diffAbs });
    else sub = t('heroSubTie', { diff: diffAbs });
    $('#heroSub').innerHTML = sub;

    // KPIs
    $('#kpiTrigger').textContent = trig.reachable ? pct(trig.value, 2) : t('unreachable');
    const margin = trig.reachable ? p.D - trig.value : NaN;
    const mEl = $('#kpiMargin');
    mEl.textContent = isNum(margin) ? (margin > 0 ? '+' : margin < 0 ? '−' : '') + nf(0, 2).format(Math.abs(margin * 100)) + ' ' + t('pp') : '—';
    mEl.className = 'kpi-value num ' + (isNum(margin) ? (margin >= 0 ? 'pos' : 'neg') : '');
    $('#kpiClassic').textContent = isNum(classic) ? pct(classic, 2) : '—';
    $('#kpiCost').textContent = pct(res.friction, 2);

    // Table
    $('#holdUsd').textContent = money(H.netUsd, 'USD');
    $('#holdIls').textContent = money(H.netIls, 'ILS');
    $('#timingUsd').textContent = money(Tm.netUsd, 'USD');
    $('#timingIls').textContent = money(Tm.netIls, 'ILS');
    const dU = $('#diffUsd'), dI = $('#diffIls');
    dU.textContent = money(res.diffUsd, 'USD', { signed: true });
    dI.textContent = money(res.diffIls, 'ILS', { signed: true });
    const cls = 'n num ' + (res.diffUsd > 0 ? 'pos' : res.diffUsd < 0 ? 'neg' : '');
    dU.className = cls; dI.className = cls;
    $('#winHold').classList.toggle('hidden', v !== 'lose');
    $('#winTiming').classList.toggle('hidden', v !== 'win');
    $('#ilsNote').textContent = t('ilsNote', { fx: '⁦' + plainNum(p.FX, 4) + '⁩', fee: '⁦' + pct(p.Cfx, 2) + '⁩' });

    // Bar chart
    const maxV = Math.max(H.netIls, Tm.netIls, 1);
    const hPct = clamp((H.netIls / maxV) * 100, 0, 100);
    const tPct = clamp((Tm.netIls / maxV) * 100, 0, 100);
    $('#barHold').style.height = (hPct * 0.82) + '%';
    $('#barTiming').style.height = (tPct * 0.82) + '%';
    $('#barHold').classList.toggle('winner', v === 'lose');
    $('#barTiming').classList.toggle('winner', v === 'win');
    $('#barHoldVal').textContent = money(H.netIls, 'ILS');
    $('#barTimingVal').textContent = money(Tm.netIls, 'ILS');
    const v0Ils = res.V0 * p.FX;
    $('#barHoldPct').textContent = v0Ils > 0 ? t('ofPeak', { p: '⁦' + pct(H.netIls / v0Ils, 1) + '⁩' }) : '';
    $('#barTimingPct').textContent = v0Ils > 0 ? t('ofPeak', { p: '⁦' + pct(Tm.netIls / v0Ils, 1) + '⁩' }) : '';
    $('#barsWrap').setAttribute('aria-label',
      t('rowHold') + ': ' + money(H.netIls, 'ILS') + ', ' + t('rowTiming') + ': ' + money(Tm.netIls, 'ILS'));

    // Cash-flow breakdown
    const rows = [
      ['fl_v0', money(res.V0, 'USD')],
      ['fl_taxNow', money(-Tm.taxNow, 'USD')],
      ['fl_feeSell', money(-Tm.feeSell, 'USD')]
    ];
    if (p.park) rows.push(['fl_fxPark', money(-Tm.fxPark, 'USD')]);
    rows.push(['fl_cash', money(Tm.cashDeploy, 'USD')]);
    rows.push(['fl_feeBuy', money(-Tm.feeBuy, 'USD')]);
    rows.push(['fl_avgPrice', pct(Tm.avgPrice, 2)]);
    rows.push(['fl_units', '×' + plainNum(res.V0 > 0 ? Tm.units / res.V0 : 0, 4)]);
    rows.push(['fl_rec', money(Tm.rec, 'USD')]);
    if (p.basis === 'liq') {
      rows.push(['fl_exitTax', money(-Tm.exitTax, 'USD')]);
      rows.push(['fl_exitFee', money(-Tm.exitFee, 'USD')]);
      rows.push(['fl_holdExitTax', money(-H.exitTax, 'USD')]);
    }
    $('#flow').innerHTML = rows.map(([k, val]) =>
      `<li><span class="k">${escapeHtml(t(k))}</span><span class="v num">${escapeHtml(val)}</span></li>`).join('') +
      `<li class="total"><span class="k">${escapeHtml(t('fl_net'))}</span><span class="v num">${escapeHtml(money(Tm.netUsd, 'USD'))}</span></li>`;

    // Sensitivity
    renderSensitivity(sens, sensMax, p, trig);

    // Warnings
    const warns = [];
    if (Tm.troughPrice > 1) warns.push(t('warnFomo', { p: '⁦' + pct(Tm.troughPrice, 2) + '⁩' }));
    else if (p.staged && p.split < 1 && Tm.maxPrice > 1) warns.push(t('warnBounce', { p: '⁦' + pct(Tm.maxPrice, 2) + '⁩' }));
    if (p.basis === 'liq') warns.push(t('warnLiq'));
    const wb = $('#warnBox');
    wb.classList.toggle('hidden', warns.length === 0);
    wb.innerHTML = warns.map(w => '<div>' + escapeHtml(w) + '</div>').join('');
  }

  function renderSensitivity(sens, sensMax, p, trig) {
    const wrap = $('#sens');
    const maxAbs = Math.max(1, ...sens.map(s => Math.abs(s.diff)));
    let nearest = 0, best = Infinity;
    sens.forEach((s, i) => { const d = Math.abs(s.D - p.D); if (d < best) { best = d; nearest = i; } });
    const html = sens.map((s, i) => {
      const h = (Math.abs(s.diff) / maxAbs) * 100;
      const up = s.diff > 0 ? h : 0;
      const down = s.diff < 0 ? h : 0;
      const tip = t('sensTip', { d: pct(s.D, 1), v: money(s.diff, 'ILS', { signed: true }) });
      return `<div class="sens-col${i === nearest ? ' current' : ''}" title="${escapeHtml(tip)}">
          <div class="sens-up"><div class="sens-bar" style="height:${up}%"></div></div>
          <div class="sens-down"><div class="sens-bar" style="height:${down}%"></div></div>
        </div>`;
    }).join('');
    let trigHtml = '';
    if (trig.reachable && trig.value <= sensMax) {
      // Columns are centred on D_i = sensMax·i/N, so map D onto the column-centre scale.
      const N = sens.length;
      const pos = ((trig.value / sensMax) * (N - 1) + 0.5) / N * 100;
      trigHtml = `<div class="sens-trigger" style="inset-inline-start:${pos}%"><span class="num">${escapeHtml(pct(trig.value, 1))}</span></div>`;
    }
    wrap.innerHTML = html + trigHtml;
    const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => `<span class="num">${escapeHtml(pct(sensMax * f, 0))}</span>`).join('');
    $('#sensAxis').innerHTML = ticks;
  }

  /* =========================================================
     COPY SUMMARY
     ========================================================= */
  function buildSummary() {
    const { p, res, trig, classic } = state.last || compute();
    const v = verdict(res);
    const sv = state.v;
    const cur = sv.currency;
    const L = [];
    const LRM = state.lang === 'he' ? '‏' : '';
    const line = (k, val) => L.push(LRM + '• ' + k + ': ' + val);

    L.push(t('sum_title'));
    L.push('');
    L.push(LRM + '— ' + t('sum_inputs') + ' —');
    line(t('f_principal'), money(sv.principal, cur));
    line(t('f_gain'), pct(p.R, 2));
    line(t('f_drop'), pct(p.D, 2));
    line(t('f_tax'), pct(p.T, 2));
    line(t('f_commSell'), pct(p.Cs, 3));
    line(t('f_commBuy'), pct(p.Cb, 3));
    line(t('f_fxRate'), plainNum(p.FX, 4));
    line(t('f_fxFee'), pct(p.Cfx, 2));
    line(t('sum_park'), sv.park ? t('yes') : t('no'));
    line(t('f_fomo'), pct(p.E, 2));
    line(t('sum_dca'), p.staged
      ? t('sum_staged', { s: pct(p.split, 0), r: pct(1 - p.split, 0), b: pct(p.bounce, 1) })
      : t('sum_lump'));
    line(t('sum_basis'), sv.basis === 'liq' ? t('basis_liq') : t('basis_mtm'));
    L.push('');
    L.push(LRM + '— ' + t('sum_results') + ' —');
    line(t('rowHold'), money(res.hold.netUsd, 'USD') + ' | ' + money(res.hold.netIls, 'ILS'));
    line(t('rowTiming'), money(res.timing.netUsd, 'USD') + ' | ' + money(res.timing.netIls, 'ILS'));
    line(t('rowDiff'), money(res.diffUsd, 'USD', { signed: true }) + ' | ' + money(res.diffIls, 'ILS', { signed: true }));
    line(t('kpiTrigger'), trig.reachable ? pct(trig.value, 2) : t('unreachable'));
    line(t('kpiClassic'), isNum(classic) ? pct(classic, 2) : '—');
    line(t('kpiCost'), pct(res.friction, 2));
    L.push('');
    const icon = v === 'win' ? '🟢' : v === 'lose' ? '🔴' : '🟡';
    L.push(LRM + icon + ' ' + t('sum_rec') + ': ' + (v === 'win' ? t('heroWin') : v === 'lose' ? t('heroLose') : t('heroTie')));
    L.push('');
    L.push(LRM + t('disclaimer'));
    return L.join('\n');
  }

  async function copySummary() {
    const text = buildSummary();
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (_) { ok = false; }
    if (!ok) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (_) { ok = false; }
    }
    toast(ok ? t('copied') : t('copyFail'));
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  /* =========================================================
     TOOLTIP
     ========================================================= */
  const tooltip = { el: null, anchor: null, pinned: false };

  function showTooltip(btn, pin) {
    const tip = I18N[state.lang].tips[btn.dataset.tip];
    if (!tip) return;
    if (tooltip.anchor && tooltip.anchor !== btn) tooltip.anchor.setAttribute('aria-expanded', 'false');
    tooltip.anchor = btn;
    tooltip.pinned = !!pin;
    const el = tooltip.el;
    el.innerHTML = '<strong>' + escapeHtml(tip[0]) + '</strong>' + escapeHtml(tip[1]);
    el.setAttribute('dir', state.lang === 'he' ? 'rtl' : 'ltr');
    btn.setAttribute('aria-expanded', 'true');
    btn.setAttribute('aria-describedby', 'tooltip');
    el.classList.add('show');
    positionTooltip();
  }

  function positionTooltip() {
    const btn = tooltip.anchor, el = tooltip.el;
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const tw = el.offsetWidth, th = el.offsetHeight;
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    let left = r.left + r.width / 2 - tw / 2;
    left = clamp(left, 16, Math.max(16, vw - tw - 16));
    let top = r.top - th - 10;
    if (top < 8) top = Math.min(vh - th - 8, r.bottom + 10);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }

  function hideTooltip() {
    if (!tooltip.el) return;
    tooltip.el.classList.remove('show');
    if (tooltip.anchor) {
      tooltip.anchor.setAttribute('aria-expanded', 'false');
      tooltip.anchor.removeAttribute('aria-describedby');
    }
    tooltip.anchor = null;
    tooltip.pinned = false;
  }

  /* =========================================================
     EVENT HANDLING (unified delegation)
     ========================================================= */
  let rafPending = false;
  function scheduleRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); saveState(); });
  }

  function onInput(e) {
    const el = e.target;
    const key = el.dataset && el.dataset.key;
    if (!key) return;

    if (key === 'park') {
      state.v.park = el.checked;
      scheduleRender();
      return;
    }
    if (key === 'currency') {
      const next = el.value === 'ILS' ? 'ILS' : 'USD';
      if (next !== state.v.currency) {
        const fx = state.v.fxRate;
        const f = FIELD_MAP.principal;
        const converted = next === 'ILS' ? state.v.principal * fx : state.v.principal / fx;
        state.v.principal = clamp(Math.round(converted * 100) / 100, f.min, f.max);
        state.v.currency = next;
        syncNumber('principal');
        syncSlider('principal');
        setInvalid('principal', false);
        updateCurrencyUi();
      }
      scheduleRender();
      return;
    }

    const f = FIELD_MAP[key];
    if (!f) return;

    if (el.type === 'range') {
      const n = Number(el.value);
      if (!isNum(n)) return;
      state.v[key] = clamp(n, f.min, f.max);
      syncNumber(key);
      syncSlider(key);
      setInvalid(key, false);
    } else {
      const raw = el.value.trim();
      const n = raw === '' ? NaN : Number(raw);
      if (!isNum(n)) {
        setInvalid(key, raw !== '' || e.type === 'change');
        if (e.type === 'change') { syncNumber(key); setInvalid(key, false); }
        return;
      }
      const c = clamp(n, f.min, f.max);
      setInvalid(key, c !== n);
      state.v[key] = c;
      syncSlider(key);
      if (e.type === 'change' && c !== n) { syncNumber(key); setInvalid(key, false); }
    }
    scheduleRender();
  }

  function onClick(e) {
    const infoBtn = e.target.closest('.info');
    if (infoBtn) {
      e.preventDefault();
      e.stopPropagation();
      if (tooltip.anchor === infoBtn && tooltip.pinned) hideTooltip();
      else showTooltip(infoBtn, true);
      return;
    }
    const btn = e.target.closest('[data-action]');
    if (!btn) {
      if (tooltip.pinned && !e.target.closest('#tooltip')) hideTooltip();
      return;
    }
    const action = btn.dataset.action;
    if (action === 'lang') {
      const lang = btn.dataset.val === 'en' ? 'en' : 'he';
      if (lang !== state.lang) {
        state.lang = lang;
        applyLanguage();
        updateCurrencyUi();
        render();
        saveState();
      }
    } else if (action === 'theme') {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
    } else if (action === 'set') {
      const key = btn.dataset.key, val = btn.dataset.val;
      if (key === 'dcaMode' && (val === 'lump' || val === 'staged')) state.v.dcaMode = val;
      if (key === 'basis' && (val === 'mtm' || val === 'liq')) state.v.basis = val;
      $$(`[data-action="set"][data-key="${key}"]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.val === state.v[key])));
      $$('.dca-only').forEach(el => el.classList.toggle('hidden', state.v.dcaMode !== 'staged'));
      scheduleRender();
    } else if (action === 'copy') {
      copySummary();
    } else if (action === 'reset') {
      state.v = { ...DEFAULTS };
      syncAllInputs();
      render();
      saveState();
      toast(t('resetDone'));
    }
  }

  function bindEvents() {
    document.addEventListener('input', onInput);
    document.addEventListener('change', onInput);
    document.addEventListener('click', onClick);

    document.addEventListener('pointerover', e => {
      if (e.pointerType === 'touch') return;
      const b = e.target.closest && e.target.closest('.info');
      if (b && !tooltip.pinned) showTooltip(b, false);
    });
    document.addEventListener('pointerout', e => {
      if (e.pointerType === 'touch') return;
      const b = e.target.closest && e.target.closest('.info');
      if (b && !tooltip.pinned && (!e.relatedTarget || !b.contains(e.relatedTarget))) hideTooltip();
    });
    document.addEventListener('focusin', e => {
      if (e.target.classList && e.target.classList.contains('info')) showTooltip(e.target, false);
    });
    document.addEventListener('focusout', e => {
      if (e.target.classList && e.target.classList.contains('info') && !tooltip.pinned) hideTooltip();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTooltip(); });
    window.addEventListener('scroll', () => { if (tooltip.anchor) positionTooltip(); }, { passive: true });
    window.addEventListener('resize', () => { if (tooltip.anchor) positionTooltip(); });

    // Keep number fields from changing value on accidental wheel scroll
    document.addEventListener('wheel', e => {
      if (e.target.matches && e.target.matches('.num-wrap input[type="number"]') && document.activeElement === e.target) e.target.blur();
    }, { passive: true });
  }

  /* =========================================================
     INIT
     ========================================================= */
  function init() {
    loadState();
    tooltip.el = $('#tooltip');
    applyTheme();
    buildFields();
    applyLanguage();
    syncAllInputs();
    bindEvents();
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
